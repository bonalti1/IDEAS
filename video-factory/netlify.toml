# Netlify hosts the UI only. The API (Node + FFmpeg + long-running jobs) must
# run elsewhere (e.g. Render, Railway, Fly.io) with `npm start`.
# Replace https://YOUR-API-HOST below with that server's URL.

[build]
  command = "npm ci && npx vite build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"

# Proxy API and media requests to the backend.
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-API-HOST/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/media/*"
  to = "https://YOUR-API-HOST/media/:splat"
  status = 200
  force = true

# Single-page app fallback.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
