<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ALTO Pro</title>
    <meta name="facebook-domain-verification" content="p9jieaz9ygad3z6fw0z1uthqrww4g3" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#101B30" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ALTO Pro" />
    <script>
      /* Crash reporter — inert unless the app errors; then it quietly sends the
         exact error to the server so it can be read at /errors. Fully wrapped so
         it can never itself break the page. */
      (function () {
        try {
          var sent = 0, seen = {};
          function report(p) {
            try {
              if (sent >= 8) return;
              var k = (p.msg || "") + (p.line || "");
              if (seen[k]) return; seen[k] = 1; sent++;
              // Never ship credentials to the log: the PWA start_url and staff
              // links can carry ?s=/?key=/?pass=/session tokens in the URL.
              p.ua = navigator.userAgent;
              p.url = String(location.href).replace(/([?&#](s|key|pass|session|token|invite)=)[^&#]*/gi, "$1REDACTED");
              p.t = new Date().toISOString();
              fetch("/api/clienterror", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(p), keepalive: true }).catch(function () {});
            } catch (e) {}
          }
          window.addEventListener("error", function (e) {
            report({ kind: "error", msg: (e && e.message) || String(e), src: e && e.filename, line: e && e.lineno, col: e && e.colno, stack: e && e.error && e.error.stack ? String(e.error.stack).slice(0, 1400) : "" });
          });
          window.addEventListener("unhandledrejection", function (e) {
            var r = e && e.reason;
            report({ kind: "promise", msg: r && r.message ? r.message : String(r), stack: r && r.stack ? String(r.stack).slice(0, 1400) : "" });
          });
        } catch (e) {}
      })();
    </script>
    <style>
      /* Desktop-only affordances: hover feedback + thin scrollbars. Phones
         (<1024px) never match this block — the mobile app is untouched. */
      @media (min-width: 1024px) {
        button { cursor: pointer; }
        .dskrow { transition: background 0.12s, border-color 0.12s; }
        .dskrow:hover { background: #fafbfd !important; border-color: #d9dfea !important; }
        .snv { transition: background 0.12s; }
        .snv:hover { background: #f4f6fa; }
        .app-scroll { scrollbar-width: thin; scrollbar-color: #d9dfea transparent; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
